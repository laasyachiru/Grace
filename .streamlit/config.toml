[theme]
base = "dark"
primaryColor = "#20A9B7"              # electric teal
backgroundColor = "#1C1B19"           # warm charcoal
secondaryBackgroundColor = "#282621"  # deeper charcoal for sidebar and inputs
textColor = "#F4EFE4"                 # warm ivory
font = "sans serif"

[server]
runOnSave = true                      # app refreshes automatically when you save a file
